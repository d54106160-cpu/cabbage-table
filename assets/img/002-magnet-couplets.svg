<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="公寓金屬大門上，用黏貼式磁鐵吸住的紅色春聯">
  <circle cx="120" cy="120" r="110" fill="#F3EAD3"/>
  <g stroke="#2F4A34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 門框與金屬大門 -->
    <rect x="52" y="26" width="136" height="190" rx="4" fill="#B9DBA5"/>
    <rect x="62" y="36" width="116" height="180" rx="2" fill="#9AA3A0"/>
    <!-- 門上金色飾框 -->
    <rect x="78" y="56" width="84" height="140" rx="2" fill="none" stroke="#F5B935" stroke-width="5"/>
    <!-- 門把 -->
    <circle cx="164" cy="132" r="5" fill="#2F4A34"/>
    <!-- 春聯（正在吸上去，微微傾斜） -->
    <g transform="rotate(-6 120 120)">
      <rect x="98" y="70" width="44" height="110" rx="3" fill="#D9473B"/>
      <!-- 四角黏貼磁鐵 -->
      <rect x="98" y="70" width="11" height="11" fill="#2F4A34"/>
      <rect x="131" y="70" width="11" height="11" fill="#2F4A34"/>
      <rect x="98" y="169" width="11" height="11" fill="#2F4A34"/>
      <rect x="131" y="169" width="11" height="11" fill="#2F4A34"/>
    </g>
  </g>
  <text x="118" y="122" text-anchor="middle" font-size="22" font-weight="900" fill="#F5B935" font-family="Noto Sans TC, sans-serif" transform="rotate(-6 120 120)">福</text>
  <!-- 吸附小火花 -->
  <g stroke="#2F4A34" stroke-width="3" stroke-linecap="round">
    <path d="M150 62 l8 -8 M154 74 l10 -2"/>
    <path d="M86 186 l-8 8 M82 174 l-10 2"/>
  </g>
</svg>
