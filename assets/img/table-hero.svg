    <!-- 主菜：盤子＋高麗菜＋蛋 -->
    <ellipse cx="160" cy="142" rx="56" ry="24" fill="#F3EAD3"/>
    <path d="M118 142 q2 -20 30 -22 q16 -10 34 0 q24 2 26 20 q-6 14 -30 16 q-20 6 -36 0 q-22 0 -24 -14 z" fill="#7DB46C"/>
    <path d="M140 140 q0 -12 16 -12 q10 -6 20 2 q10 4 4 12 q-6 8 -22 7 q-18 1 -18 -9 z" fill="#FFFDF7"/>
    <circle cx="160" cy="137" r="8" fill="#F5B935"/>
    <!-- 小碗們 -->
    <ellipse cx="70" cy="140" rx="18" ry="8" fill="#B9DBA5"/>
    <ellipse cx="250" cy="140" rx="18" ry="8" fill="#B9DBA5"/>
    <ellipse cx="110" cy="172" rx="16" ry="7" fill="#B9DBA5"/>
    <ellipse cx="210" cy="172" rx="16" ry="7" fill="#B9DBA5"/>
    <!-- 主桌立牌 -->
    <path d="M150 92 h20 l-4 -24 h-12 z" fill="#D9473B"/>
    <path d="M154 68 l6 -10 l6 10" fill="#F5B935"/>
