<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-label="一張圓形宴會桌，中間主位擺著一盤高麗菜煮蛋，旁邊圍著空椅子">
  <g stroke="#2F4A34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 後排椅子 -->
    <rect x="70" y="44" width="40" height="46" rx="10" fill="#F5B935"/>
    <rect x="140" y="30" width="40" height="46" rx="10" fill="#F5B935"/>
    <rect x="210" y="44" width="40" height="46" rx="10" fill="#F5B935"/>
