    <path d="M160 200 v52 M126 252 h68" fill="none"/>
    <!-- 桌面 -->
    <ellipse cx="160" cy="150" rx="140" ry="62" fill="#FFFDF7"/>
    <path d="M20 150 q0 26 140 62 q140 -36 140 -62" fill="#7DB46C"/>
    <ellipse cx="160" cy="146" rx="140" ry="58" fill="#FFFDF7"/>
