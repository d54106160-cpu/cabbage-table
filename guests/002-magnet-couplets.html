      <ul class="tags">

      </ul>

      <p class="pain">家裡大門是金屬門，每年換春聯都留一堆殘膠，刮到手痠還刮不乾淨。</p>

      <h2>💡 神招做法</h2>
      <ol class="steps">
        <li>買黏貼式磁鐵片，貼在春聯背面的四個角。</li>
        <li>直接吸上金屬大門，不用膠帶。</li>
        <li>明年要換時拿下來就好，一秒換新、門上不留膠。</li>
      </ol>
