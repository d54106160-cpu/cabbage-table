      <h1>高麗菜煮蛋</h1>
      <ul class="tags">
        <li>🍳 廚房</li>
      </ul>

      <p class="pain">火鍋裡打蛋，不是散成蛋花，就是黏在湯勺上洗不掉。</p>

      <h2>💡 神招做法</h2>
      <ol class="steps">
        <li>把一片完整的高麗菜葉平放在湯面上。</li>
        <li>把蛋直接打在菜葉的凹槽裡。</li>
        <li>轉中小火，舀熱湯淋在蛋上，煮到喜歡的熟度（小心燙手）。</li>
      </ol>
